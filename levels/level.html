  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>

  <script>
    // Якщо скрипт гри впав під час побудови сторінки (наприклад, браузер узяв із кешу
    // файли різних версій), замість порожнього екрана — пояснення й кнопка «Оновити».
    (function () {
      var shown = false;
      window.addEventListener("error", function (e) {
        if (shown || !e.filename || e.filename.indexOf("/js/") === -1) return;
        setTimeout(function () {
          var main = document.getElementById("main");
          if (shown || !main || main.innerText.trim()) return;
          shown = true;
          main.innerHTML = '<section class="card locked-screen"><h1>Сторінка не завантажилась</h1>' +
            "<p>Схоже, браузер узяв частину файлів гри зі старої версії. Онови сторінку — твій прогрес не загубиться.</p>" +
            '<div class="locked-actions"><button type="button" class="btn btn-primary" id="boot-reload">Оновити сторінку</button></div></section>';
          document.getElementById("boot-reload").addEventListener("click", function () { location.reload(); });
        }, 0);
      });
    })();
  </script>
